name: Package release

# GitHub's auto-generated "Source code" zip extracts to <repo>-<tag>, which is
# the wrong folder name for an Ashita addon and cannot be renamed. This builds
# a properly named zip and attaches it to the release instead.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so the annotated tag message is available for release notes.
          fetch-depth: 0

      - name: Build addon zip
        run: |
          mkdir -p dist/Clammy
          cp -r clammy.lua functions.lua constants.lua README.md images clam.wav stop.wav dist/Clammy/
          cd dist && zip -r ../Clammy.zip Clammy

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "Clammy.zip" --clobber
          else
            gh release create "$TAG" "Clammy.zip" \
              --title "Clammy $TAG" --notes-from-tag
          fi
